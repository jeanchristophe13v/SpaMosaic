channels:
- conda-forge
- bioconda
- defaults
dependencies:
- python=3.8.13
- anndata=0.9.2
- python-annoy
- h5py=3.10.0
- hnswlib
- networkx=3.1
- numpy=1.22.4
- pandas=1.5.3
- PyYAML=6.0.1
- scanpy=1.9.6
- scikit-learn=1.3.2
- scipy=1.10.1
- seaborn=0.12.2
- tqdm=4.66.1
- r-base=4.1
- r-mclust
- pip
- pip:
  - rpy2==3.5.15
  - matplotlib==3.7.4
  # ---- PyTorch / PyTorch Geometric(默认 CPU 构建) ----
  # GPU 环境请参照 docs/source/install.rst 换成与本地 CUDA 匹配的构建,
  # 例如 CUDA 11.7:
  #   --extra-index-url https://download.pytorch.org/whl/cu117
  #   torch==2.0.0+cu117
  #   --find-links https://data.pyg.org/whl/torch-2.0.0+cu117.html
  - --extra-index-url https://download.pytorch.org/whl/cpu
  - --find-links https://data.pyg.org/whl/torch-2.0.0+cpu.html
  - torch==2.0.0+cpu
  - torch-geometric==2.3.1
  - torch-scatter
  - torch-sparse
  - pyg_lib
  - torch-cluster
  - torch-spline-conv
  # ---- harmony 批次校正(spamosaic/preprocessing.py: from harmony import harmonize) ----
  - harmony-pytorch
  # ---- scanpy 平滑等依赖 skmisc.loess ----
  - scikit-misc
  # ---- 评估指标 iLISI(reproduce/code/compute_metrics/metrics.py: from scib.metrics import lisi) ----
  # 1.1.5 要求 pandas>=2,与上面的 pandas=1.5.3 冲突,所以固定 1.1.4。
  # 必须从源码安装(需要 g++):wheel 里预编译的 knn_graph.o 依赖 GLIBC 2.34,
  # 在较老的系统上无法运行,iLISI 会报 graph_lisi_indices_0.txt 找不到。
  - --no-binary scib
  - scib==1.1.4

name: spamosaic-env
